<div class="row">
    <div class="col-sm-12 form__container">
        <div ix3-form>
            <legend class="form__title">Ficheros de Log</legend>

            <ix3-business-messages></ix3-business-messages>

            <div class="form-group" style="margin-bottom: 16px;">
                <label for="tipoLogFile" style="margin-right: 8px;">Tipo de fichero:</label>
                <select id="tipoLogFile" class="form-control" style="width: auto; display: inline-block;" ng-model="tipoSeleccionado">
                    <option value="____NINGUNO____">--Seleccione el tipo de fichero de log--</option>
                    <option value="">Todos</option>
                    <option ng-repeat="tipo in tiposLogFile" value="{{tipo}}">{{tipo}}</option>
                </select>
            </div>

            <table class="table table-bordered">
                <thead>
                    <tr class="data-table__head">
                        <th style="text-align: center">Nombre</th>
                        <th style="width: 120px; text-align: center">Tamaño</th>
                        <th style="width: 160px; text-align: center">Fecha de creación</th>
                        <th style="width: 160px; text-align: center">Fecha de modificación</th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="logFile in logFiles | filter:filtrarPorTipo" class="data-table__row">
                        <td><a href ng-click="verFichero(logFile.idLogFile)">{{logFile.nombre}}</a></td>
                        <td style="text-align: right">{{(logFile.size / 1024) | number:1}} KB</td>
                        <td style="text-align: center">{{logFile.fechaCreacion | date: 'dd/MM/yyyy HH:mm'}}</td>
                        <td style="text-align: center">{{logFile.fechaModificacion | date: 'dd/MM/yyyy HH:mm'}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-sm-12 form__container" >
        <div ix3-form>
            <legend class="form__title">Domino Conocido</legend>

            <div class="row">
                <div class="col-xs-12 col-sm-6"> 
                    <input ng-model="filters.$lliker.dominio" type="text" class="form-control" id="dominio" name="dominio" placeholder="Dominio"  > 
                </div> 
            </div>
            <br>
            <div class="row" >
                <div class="col-xs-12 ">
                    <button type="button" class="c-button c-button--primary c-button--size-small" ng-click="buttonSearch()">Buscar</button>
                </div>
            </div>
            <br>
            <ix3-business-messages></ix3-business-messages>
            <table class="table table-bordered">
                <thead>                        
                    <tr class="data-table__head">
                        <th ix3-order-field-names="dominio"  style="min-width:  100%;text-align: center">Dominio</th>
                        <th ix3-order-field-names="tipoDominioConocido" style="width:      150px;text-align: center">Tipo</th>
                        <th ix3-order-field-names="fechaAlta" style="width:      120px;text-align: center">Fecha Alta</th>

                        <th style="width:90px;text-align: center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="dominioConocido in models" class="data-table__row">
                        <td ><a href ng-click="buttonEdit(dominioConocido.idDominioConocido)">{{dominioConocido.dominio}}</a></td>
                        <td >{{dominioConocido.tipoDominioConocido}}</td>
                        <td >{{dominioConocido.fechaAlta | date: 'dd/MM/yyyy'}}</td>
                        <td class="text-center">                           
                            <button class="c-button c-button--danger c-button--size-extra-small" type="button" ng-click="buttonDelete(dominioConocido.idDominioConocido)"><i class="fa fa-trash" aria-hidden="true"></i></button>
                        </td>                             
                    </tr>
                </tbody>
            </table> 

            <div class="row">
                <div class="col-sm-12">
                    <ix3-pagination></ix3-pagination>
                </div>
            </div>

            <button type="button" class="c-button c-button--alt-primary c-button--size-small" ng-click="buttonNew()">Nuevo Domino Conocido</button>
        </div>
    </div>
</div>

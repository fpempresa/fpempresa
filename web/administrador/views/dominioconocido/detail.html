<div class="row">
    <div class="col-xs-12 form__container" >
        <div>
            <ix3-business-messages></ix3-business-messages>
            <form name="mainForm" id="mainForm"  ix3-form>
                <fieldset>
                    <legend class="form__title">Dominio Conocido</legend>


                    <div class="row" >
                        <div class="col-xs-12 form-horizontal"> 
                            <div class="form-group">
                                <label for="dominio" class="col-xs-3  control-label" ix3-label></label>
                                <div class="col-xs-9 ">
                                    <input ng-model="model.dominio" type="text" class="form-control" id="dominio" name="dominio"  ix3-validation required>
                                </div>
                            </div> 
                        </div>
                    </div>
                    <div class="row" >
                        <div class="col-xs-12 form-horizontal"> 
                            <div class="form-group">
                                <label for="model.tipoDominioConocido" class="col-sm-3  control-label" ix3-label ></label>
                                <div class="col-sm-3">
                                    <select ng-model="model.tipoDominioConocido" id="model.tipoDominioConocido" name="model.tipoDominioConocido" class="form-control" ix3-options  required>
                                        <option value="">-- Elige Opcion --</option>
                                    </select>
                                </div>
                            </div> 
                        </div>
                    </div>
                    <div class="row" >
                        <div class="col-xs-12 form-horizontal"> 
                            <div   class="form-group">
                                <label for="model.fechaAlta" class="col-sm-3  control-label" ix3-label ></label>
                                <div class="col-xs-3 ">
                                    <input ng-model="model.fechaAlta" type="text" class="form-control" id="model.fechaAlta" name="model.fechaAlta"  ix3-date="dd/MM/yyyy"  ix3-validation readonly="true">
                                </div>
                            </div>                      
                        </div>
                    </div>
                    <br>
                    <div class="row" >
                        <div class="col-xs-12 ">
                            <div class="pull-right">
                                <fpe-cancel-button></fpe-cancel-button>
                                <fpe-ok-button></fpe-ok-button>
                            </div>
                        </div>
                    </div>
                </fieldset>
            </form>
        </div>
    </div>
</div>
